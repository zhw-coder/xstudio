[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/ai",
    "crates/plugins",
    "crates/tool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Shared deps — pin once, reference via { workspace = true }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
ignore = "0.4"
jsonschema = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros", "serde", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Internal crates
ai = { path = "crates/ai" }
plugins = { path = "crates/plugins" }
tool = { path = "crates/tool" }