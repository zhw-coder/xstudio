name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            tauriArgs: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            tauriArgs: --target aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            tauriArgs: ""
          - name: Linux
            os: ubuntu-22.04
            tauriArgs: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Set Intel macOS deployment target
        if: matrix.name == 'macOS Intel'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      - name: Build and publish desktop packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: XStudio ${{ github.ref_name }}
          releaseBody: "XStudio ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauriArgs }}
